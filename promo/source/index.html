<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split Bill Film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=block">
<style>
:root{
  --bg:#0e0d0c; --panel:#191715; --panel2:#201e1b; --line:#34302b; --line2:#4a453e;
  --fg:#f3efe8; --muted:#8f897f; --dim:#5d5850;
  --mint:#6cc3a8; --mint2:#9fe0cb; --coral:#ff8a6b; --amber:#f2c46d;
  --a:#b8a6ff; --b:#7cc4ff; --v:#f2c46d; --g:#ff9ec4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:'Inter Tight',system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
.abs{position:absolute}
.scene{left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* type */
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0.04em 0.02em 0.16em;margin:-0.04em -0.02em -0.16em}
.wi{display:inline-block;will-change:transform}
.acc{color:var(--mint)}
.acc2{color:var(--coral)}
.h{font-weight:700;letter-spacing:-0.035em;line-height:1.02;white-space:normal}
.xl{font-size:104px}
.l{font-size:86px}
.k{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500;letter-spacing:0.22em;color:var(--mint)}
.sub{font-size:30px;line-height:1.38;color:var(--muted);font-weight:500;letter-spacing:-0.01em}
.sub b{color:var(--fg);font-weight:600}

/* avatars */
.av{border-radius:50%;display:grid;place-items:center;color:#14120f;font-weight:800;letter-spacing:-0.04em}
.name{font-size:30px;font-weight:600;color:var(--fg);letter-spacing:-0.01em}

/* cards & pills */
.card{background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:0 40px 120px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04)}
.pill{display:flex;align-items:center;gap:16px;padding:0 28px;border-radius:40px;background:var(--panel2);border:1px solid var(--line);font-size:30px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pill i{width:16px;height:16px;border-radius:50%;flex:none}
.pill b{font-weight:600}
.pill span{margin-left:auto;color:var(--muted);font-size:27px}

.tag{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.ctext{font-size:38px;line-height:1.36;font-weight:500;letter-spacing:-0.015em}
.caret{display:inline-block;width:3px;height:1em;background:var(--mint);vertical-align:-0.12em;margin-left:3px}
.send{border-radius:50%;background:var(--mint);display:grid;place-items:center}

.chip{display:flex;align-items:center;gap:14px;height:58px;padding:0 22px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--fg)}
.chip .fn{color:var(--b)}
.chip .ok{margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(108,195,168,.16);display:grid;place-items:center}

/* orb */
.orb-core{border-radius:50%;background:radial-gradient(circle at 35% 30%, #d9fff1 0%, #8fe3c8 22%, #3f9c84 60%, #1d5446 100%);box-shadow:0 0 60px rgba(108,195,168,.55), 0 0 140px rgba(108,195,168,.25)}
.orb-glow{border-radius:50%;background:radial-gradient(circle, rgba(108,195,168,.28), rgba(108,195,168,0) 65%)}
.orb-shock{border-radius:50%;border:2px solid var(--mint)}

/* code */
.code{background:#121110}
.cl{font-family:'JetBrains Mono',monospace;font-size:21px;white-space:pre;line-height:44px;height:44px}
.cl .p{color:#6f695f}.cl .k{color:#a9a3f5}.cl .s{color:#c9c2b6}.cl .c{color:var(--amber);font-weight:700}.cl .m{color:var(--mint);font-weight:700}
.lineHi{left:0;width:800px;height:44px;background:linear-gradient(90deg, rgba(108,195,168,.14), rgba(108,195,168,0));border-left:3px solid var(--mint)}
.fly{height:40px;padding:0 16px;border-radius:12px;background:var(--amber);color:#1b1608;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;display:flex;align-items:center;white-space:nowrap;box-shadow:0 10px 30px rgba(242,196,109,.35)}
.fly.dm{background:var(--mint);box-shadow:0 10px 30px rgba(108,195,168,.4);color:#0d2019}

/* render surface */
.frame{border:2px dashed rgba(108,195,168,.55);border-radius:30px}
.ftag{font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--mint);letter-spacing:.12em}
.sk{background:linear-gradient(90deg,#2a2723 0%,#38342e 50%,#2a2723 100%);background-size:400px 100%;border-radius:8px}
.row{border-radius:18px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.btn{border-radius:16px;display:grid;place-items:center;font-size:22px;font-weight:600}

/* editor */
.seg{border-radius:34px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.segi{border-radius:28px;background:var(--mint);box-shadow:0 8px 30px rgba(108,195,168,.35)}
.segl{width:198px;text-align:center;font-size:24px;font-weight:600;line-height:64px}
.chk{width:40px;height:40px;border-radius:11px;background:var(--mint);display:grid;place-items:center}
.stp{width:184px;height:54px;border-radius:14px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:28px;font-weight:600}
.stp .pm{color:var(--muted);font-weight:500;font-size:30px}
.amt{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:500;text-align:right}
.tele{display:flex;align-items:center;gap:14px;height:56px;padding:0 24px;border-radius:28px;background:rgba(108,195,168,.10);border:1px solid rgba(108,195,168,.35);font-family:'JetBrains Mono',monospace;font-size:21px;color:var(--mint2);white-space:nowrap}
.bubble{border-radius:28px 28px 28px 8px;background:#1f2a26;border:1px solid rgba(108,195,168,.35);padding:26px 32px;font-size:36px;font-weight:500;letter-spacing:-0.015em;line-height:1.3}

/* settle */
.bar{height:46px;border-radius:12px}
.val{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700}
.apill{height:52px;padding:0 22px;border-radius:26px;background:var(--panel2);border:1px solid var(--line2);font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;display:flex;align-items:center;white-space:nowrap}
.badge{height:58px;padding:0 28px;border-radius:29px;border:1px solid rgba(108,195,168,.5);background:rgba(108,195,168,.1);color:var(--mint2);font-size:24px;font-weight:600;display:flex;align-items:center;gap:12px;white-space:nowrap}

/* outro */
.feat{border-radius:28px;background:var(--panel);border:1px solid var(--line);padding:30px 34px;display:flex;gap:24px;align-items:center}
.feat .ic{width:72px;height:72px;border-radius:20px;background:rgba(108,195,168,.12);display:grid;place-items:center;flex:none}
.feat b{display:block;font-size:34px;font-weight:700;letter-spacing:-0.02em}
.feat span{display:block;font-size:22px;color:var(--muted);margin-top:6px;line-height:1.3}
.wm{font-size:150px;font-weight:800;letter-spacing:-0.05em;line-height:1;white-space:nowrap}
.wm span{display:inline-block}
.q{width:78px;height:78px}

/* hud */
.brand{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700;letter-spacing:-0.01em}
.brand em{font-style:normal;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:16px;color:var(--muted);letter-spacing:.08em}
.mini{width:26px;height:26px;border-radius:50%;background:conic-gradient(from -90deg, var(--a) 0 23%, transparent 0 25%, var(--b) 0 48%, transparent 0 50%, var(--v) 0 73%, transparent 0 75%, var(--g) 0 98%, transparent 0)}
.chap{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.track{height:3px;border-radius:2px;background:rgba(255,255,255,.10);overflow:hidden}
.fill{height:100%;background:var(--mint);transform-origin:0 50%}
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
const W = 1920, H = 1080, DURATION = 30;

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: x => x,
  inC: x => x * x * x,
  outC: x => 1 - Math.pow(1 - x, 3),
  ioC: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQ: x => 1 - Math.pow(1 - x, 5),
  outE: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  ioE: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outB: x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  spr: x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(10.5 * x),
};
const pr = (t, a, d, e = E.outC) => e(clamp((t - a) / d));
const bump = (t, a, d) => { const x = clamp((t - a) / d); return Math.sin(x * Math.PI); };
const fmt = n => Math.round(n).toLocaleString('en-US');
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));

/* ---------- dom ---------- */
const NOPX = new Set(['opacity', 'zIndex', 'fontWeight', 'lineHeight', 'flex']);
function el(p, cls, css = {}, html = '') {
  const d = document.createElement('div');
  d.className = cls || '';
  for (const k in css) { const v = css[k]; d.style[k] = (typeof v === 'number' && !NOPX.has(k)) ? v + 'px' : v; }
  if (html) d.innerHTML = html;
  p.appendChild(d);
  return d;
}
function T(e, o = {}) {
  const { x = 0, y = 0, s = 1, r = 0, op, blur, sx, sy } = o;
  e.style.transform = `translate3d(${x}px,${y}px,0) rotate(${r}deg) scale(${sx ?? s},${sy ?? s})`;
  if (op !== undefined) e.style.opacity = op;
  if (blur !== undefined) e.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
}
function O(e, op) { e.style.opacity = op; }
const NS = 'http://www.w3.org/2000/svg';
function svg(p, x = 0, y = 0, w = W, h = H) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('width', w); s.setAttribute('height', h);
  Object.assign(s.style, { position: 'absolute', left: x + 'px', top: y + 'px', overflow: 'visible' });
  p.appendChild(s); return s;
}
function sv(p, tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); p.appendChild(e); return e; }
function stroke(s, d, attrs) {
  const e = sv(s, 'path', Object.assign({ d, fill: 'none', 'stroke-linecap': 'round' }, attrs));
  e._len = e.getTotalLength(); e.style.strokeDasharray = e._len; e.style.strokeDashoffset = e._len; return e;
}
const draw = (e, p) => { e.style.strokeDashoffset = e._len * (1 - p); };

/* words with masked per-word reveal; *word* = accent */
function words(p, css, text, cls) {
  const d = el(p, 'abs ' + cls, css);
  d.innerHTML = text.split(' ').map(w => {
    let c = '';
    if (w.startsWith('**')) c = ' acc2';
    else if (w.startsWith('*')) c = ' acc';
    w = w.replace(/\*/g, '');
    return `<span class="w"><span class="wi${c}">${w}</span></span>`;
  }).join(' ');
  d._w = [...d.querySelectorAll('.wi')];
  return d;
}
function wr(d, t, a, b = null, st = 0.06, dur = 0.75) {
  const n = d._w.length;
  if (t < a - 0.01 || (b !== null && t > b + n * st * 0.6 + 0.5)) { d.style.display = 'none'; return; }
  d.style.display = 'block';
  d._w.forEach((w, i) => {
    const p = pr(t, a + i * st, dur, E.outE);
    let y = (1 - p) * 110, o = p, r = (1 - p) * 4;
    if (b !== null) { const q = pr(t, b + i * st * 0.6, 0.45, E.inC); y -= q * 110; o *= 1 - q; }
    w.style.transform = `translateY(${y}%) rotate(${r}deg)`; w.style.opacity = o;
  });
}

const P = [
  { n: 'Anya', c: '#b8a6ff', l: '#e2d9ff' },
  { n: 'Borya', c: '#7cc4ff', l: '#d1ecff' },
  { n: 'Vika', c: '#f2c46d', l: '#fff0c9' },
  { n: 'Gena', c: '#ff9ec4', l: '#ffdbe9' },
];
function avatar(p, i, size, cx, cy) {
  const d = el(p, 'abs av', { left: cx - size / 2, top: cy - size / 2, width: size, height: size, fontSize: size * 0.42 }, P[i].n[0]);
  d.style.background = `radial-gradient(circle at 32% 26%, ${P[i].l} 0%, ${P[i].c} 58%)`;
  d.style.boxShadow = `0 ${size * .12}px ${size * .45}px ${P[i].c}40, inset 0 -${size * .06}px ${size * .12}px rgba(0,0,0,.12)`;
  return d;
}
const ICON = {
  send: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0d2019" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6cc3a8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chk: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0d2019" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bolt: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#9fe0cb"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  cursor: '<svg width="44" height="44" viewBox="0 0 24 24"><path d="M4 2.5l15.5 9.2-6.6 1.5 3.9 7-2.9 1.6-3.9-7.1L5.3 19z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>',
  stream: '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#6cc3a8" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M4 12h16M4 18h7"/></svg>',
  photo: '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#6cc3a8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  loop: '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#6cc3a8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>',
};

const stage = document.getElementById('stage');

/* ================= BACKGROUND ================= */
const bg = el(stage, 'abs', { left: 0, top: 0, width: W, height: H });
const blobs = [
  { c: 'rgba(108,195,168,.20)', s: 1500 },
  { c: 'rgba(184,166,255,.14)', s: 1300 },
  { c: 'rgba(242,196,109,.10)', s: 1200 },
].map(b => el(bg, 'abs', { left: 0, top: 0, width: b.s, height: b.s, marginLeft: -b.s / 2, marginTop: -b.s / 2, borderRadius: '50%', background: `radial-gradient(circle, ${b.c}, transparent 62%)` }));
const grid = el(bg, 'abs', { left: -60, top: -60, width: W + 120, height: H + 120,
  backgroundImage: 'radial-gradient(circle, rgba(255,255,255,.075) 1.2px, transparent 1.8px)', backgroundSize: '44px 44px',
  WebkitMaskImage: 'radial-gradient(ellipse 70% 70% at 50% 50%, #000 20%, transparent 80%)' });

const world = el(stage, 'abs', { left: 0, top: 0, width: W, height: H });

/* ================= SCENE 1 — the problem (0 – 4.4) ================= */
const s1 = el(world, 'abs scene');
const s1hA = words(s1, { left: 0, top: 170, width: W, textAlign: 'center' }, 'Four friends. One dinner.', 'h xl');
const s1hB = words(s1, { left: 0, top: 170, width: W, textAlign: 'center' }, 'So who owes *whom?*', 'h xl');
const s1svg = svg(s1);
const S1AV = P.map((p, i) => {
  const cx = 960 + (i - 1.5) * 250, cy = 480;
  return { a: avatar(s1, i, 150, cx, cy), n: el(s1, 'abs name', { left: cx - 100, top: cy + 92, width: 200, textAlign: 'center' }, p.n), cx, cy };
});
const ITEMS = [{ t: 'Food', v: 1200, pay: 1 }, { t: 'Hookahs', v: 800, pay: 0 }, { t: 'Wine', v: 600, pay: 0 }, { t: 'Tip', v: 260, pay: 2 }];
const S1PILL = ITEMS.map((it, i) => {
  const cx = 960 + (i - 1.5) * 345, cy = 830;
  const d = el(s1, 'abs pill', { left: cx - 155, top: cy - 38, width: 310, height: 76 }, `<i style="background:${P[it.pay].c}"></i><b>${it.t}</b><span class="mono">${fmt(it.v)}</span>`);
  const a = S1AV[it.pay];
  const ln = stroke(s1svg, `M${a.cx},${a.cy + 145} C${a.cx},${a.cy + 230} ${cx},${cy - 150} ${cx},${cy - 42}`, { stroke: P[it.pay].c, 'stroke-width': 2.5, 'stroke-opacity': .6 });
  return { d, cx, cy, ln };
});

function scene1(t) {
  const on = t < 4.7; s1.style.display = on ? 'block' : 'none'; if (!on) return;
  T(s1, { s: 1 + t * 0.006 });
  wr(s1hA, t, 0.25, 2.15);
  wr(s1hB, t, 2.4, 3.75);
  S1AV.forEach((o, i) => {
    const p = pr(t, 0.55 + i * 0.09, 0.95, E.spr), q = pr(t, 3.7 + i * 0.05, 0.6, E.inC);
    const fl = Math.sin(t * 1.7 + i * 1.4) * 5;
    T(o.a, { y: (1 - p) * 70 + fl - q * 50, s: p * (1 - q * 0.25), op: clamp(p * 3) * (1 - q), blur: q * 10 });
    const pn = pr(t, 0.9 + i * 0.09, 0.6);
    T(o.n, { y: (1 - pn) * 18 - q * 50, op: pn * (1 - q) });
  });
  S1PILL.forEach((o, i) => {
    draw(o.ln, pr(t, 1.3 + i * 0.12, 0.7, E.ioC));
    o.ln.style.opacity = 1 - pr(t, 3.55, 0.4);
    const p = pr(t, 1.6 + i * 0.12, 0.9, E.spr);
    const q = pr(t, 3.7 + i * 0.07, 0.75, E.ioC);
    const tx = 600 - o.cx, ty = 600 - o.cy;
    T(o.d, { x: tx * q, y: (1 - p) * 50 + ty * q - Math.sin(q * Math.PI) * 140, s: lerp(0.85 + 0.15 * p, 0.3, q), r: q * (i - 1.5) * 8,
      op: clamp(p * 2) * (1 - pr(t, 4.1 + i * 0.07, 0.3)) });
  });
}

/* ================= SCENE 2 — describe (4.2 – 9.4) ================= */
const s2 = el(world, 'abs scene');
const s2k = words(s2, { left: 160, top: 180 }, '01 — DESCRIBE', 'k');
const s2h = words(s2, { left: 160, top: 214, width: 1100 }, 'Just say what *happened.*', 'h l');
const s2sub = words(s2, { left: 160, top: 326, width: 900 }, 'No forms. The agent turns your words into tool calls.', 'sub');
const comp = el(s2, 'abs card', { left: 160, top: 430, width: 880, height: 310 });
el(comp, 'abs tag', { left: 40, top: 34 }, 'Message');
const ctext = el(comp, 'abs ctext', { left: 40, top: 76, width: 760 });
const send = el(comp, 'abs send', { left: 880 - 40 - 72, top: 310 - 40 - 72, width: 72, height: 72 }, ICON.send);
const MSG = 'Borya paid 1,200 for food. Anya: hookahs 800 and wine 600. Vika tipped 260.';
const s2lab = el(s2, 'abs', { left: 1430 - 200, top: 560, width: 400, textAlign: 'center' },
  '<div style="font-size:30px;font-weight:700">Agent</div><div class="mono" style="font-size:18px;color:var(--muted);margin-top:6px">claude-opus-5-5</div>');
const TOOLS = ['<span class="fn">create_bill</span>(people, items)', '<span class="fn">get_summary</span>(bill)', '<span class="fn">render_surface</span>("bill")'];
const S2CHIP = TOOLS.map((h, i) => el(s2, 'abs chip', { left: 1430 - 240, top: 680 + i * 74, width: 480 }, h + `<span class="ok">${ICON.ok}</span>`));
const pkt = el(s2, 'abs', { left: -11, top: -11, width: 22, height: 22, borderRadius: '50%', background: '#c9f5e6', boxShadow: '0 0 24px 6px rgba(108,195,168,.7)' });
const pktTrail = [0, 1, 2, 3, 4, 5].map(i => el(s2, 'abs', { left: -7, top: -7, width: 14, height: 14, borderRadius: '50%', background: 'rgba(108,195,168,.5)' }));

const PK0 = [954, 664], PKC = [1220, 330], PK1 = [1430, 400];
