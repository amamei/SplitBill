<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f2ee" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f6f5e'/%3E%3Cpath d='M16 2v28' stroke='%23f4f2ee' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23f4f2ee' stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <title>Split Bill · A2UI</title>
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode). Mirrors lib/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem("a2ui-theme");
          var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (pref === "light" || pref === "dark") document.documentElement.dataset.theme = pref;
          document.documentElement.classList.add(dark ? "a2ui-dark" : "a2ui-light");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#151413" : "#f4f2ee");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
